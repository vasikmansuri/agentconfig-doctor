name: False positive or missed detection
description: A rule reported something it should not have, or missed something it should catch.
labels: [rules, false-positive]
body:
  - type: markdown
    attributes:
      value: |
        Precise rules matter. Thank you for helping tune them. **Never paste real credentials.**
  - type: dropdown
    id: kind
    attributes:
      label: Type
      options:
        - False positive (reported, but should not be)
        - False negative (missed, but should be reported)
        - Wrong severity or message
    validations:
      required: true
  - type: input
    id: rule
    attributes:
      label: Rule ID
      placeholder: ACD002
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `agentconfig-doctor --version`
    validations:
      required: true
  - type: textarea
    id: snippet
    attributes:
      label: Minimal configuration snippet (redacted)
      description: Include the file name.
      render: json
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why the result is wrong
    validations:
      required: true
